name: Code Quality

on:
  pull_request:
  push:
    branches: [main]

jobs:
  source-organization:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Enforce 300 LOC source limit
        working-directory: parlezvous
        run: bun run check:loc
